[package]
name = "exhume_zfs"
version = "0.1.0"
edition = "2024"
description = "Read-only parsing of OpenZFS pools for the Exhume toolkit (labels, uberblocks, block pointers, MOS, datasets)."
documentation = "https://www.forensicxlab.com/docs/category/exhume---zfs"
repository = "https://github.com/forensicxlab/exhume_zfs"
readme = "README.md"
authors = ["k1nd0ne"]
license = "GPL-3.0-only"
keywords = ["zfs", "forensics", "filesystem", "exhume"]
categories = ["filesystem", "parser-implementations"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs", "tests/**/*.rs"]

[dependencies]
log = "0.4"
serde_json = "1.0"
flate2 = "1"
ruzstd = "0.8"
sha2 = "0.10"

[dev-dependencies]
sha2 = "0.10"
